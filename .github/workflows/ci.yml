name: CI

# One test for the program itself, and one build for each platform it
# runs on. The release is made when they all pass.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# The release job asks for more, and only it needs it.
permissions:
  contents: read

jobs:
  # The program itself: its types, and its tests. Nothing else is
  # needed for these, so they run first and every platform waits for
  # them.
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun x tsc --noEmit

      - name: Test
        run: bun test --timeout 30000

  # The Linux build: the executable most people run, and every other
  # platform's build, checked.
  linux:
    name: Build (Linux)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Lint the shell
        run: shellcheck -S warning build.sh

      # Every released platform. The Linux build is one of them, so there
      # is no need to build it twice.
      - name: Build every platform
        run: ./build.sh --all

      - name: Check the built program works
        run: |
          ./dist/orca-box-linux-x64 orca-box --help > /dev/null
          ./dist/orca-box-linux-x64 orca-box-setup --help > /dev/null
          ./dist/orca-box-linux-x64 --version

      - name: Check the musl build is musl
        run: |
          readelf -l dist/orca-box-linux-x64-musl | grep -q "ld-musl" \
            || (echo "the musl build wants the glibc loader" >&2; exit 1)

      - name: Check the macOS builds are macOS
        run: |
          # A Mach-O 64-bit binary starts with cf fa ed fe.
          for asset in dist/orca-box-darwin-x64 dist/orca-box-darwin-arm64; do
            head -c 4 "$asset" | od -An -tx1 | grep -q "cf fa ed fe" \
              || (echo "$asset is not a macOS executable" >&2; exit 1)
          done

      - name: Check the Windows build is a Windows program
        run: |
          # A Windows program starts with "MZ".
          head -c 2 dist/orca-box-windows-x64.exe | od -An -tx1 | grep -q "4d 5a" \
            || (echo "the Windows build is not a Windows program" >&2; exit 1)

  # The program has to work on macOS as well as on Linux, so it is
  # built and started there too.
  #
  # The runner is the Intel image, not macos-latest: macos-latest is the
  # arm64 image now, and the arm64 pool is much smaller, so jobs wait a
  # long time for a runner. The program is cross-compiled, so the build
  # is the same either way; only the smoke test differs.
  macos:
    name: Build (macOS)
    needs: test
    runs-on: macos-15-intel
    # The job takes a minute or two; this is here so that a job that
    # hangs cannot hold the release up for ever.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build
        run: ./build.sh

      - name: Check the built program works
        run: |
          asset="$(ls dist/orca-box-darwin-*)"
          "$asset" orca-box --help > /dev/null
          "$asset" orca-box-setup --help > /dev/null
          "$asset" --version

      - name: Check the program knows it is on macOS
        run: |
          # The command names have to survive being run through a symlink,
          # and macOS has no /proc to read them from.
          asset="$(ls dist/orca-box-darwin-*)"
          mkdir -p "$HOME/.local/bin"
          ln -sf "$PWD/$asset" "$HOME/.local/bin/orca-box-archive"
          "$HOME/.local/bin/orca-box-archive" --help | grep -q orca-box-archive

  # The program has to work on Windows as well, so it is built and
  # started there too.
  windows:
    name: Build (Windows)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build
        run: |
          bun build --compile `
            --target bun-windows-x64 `
            --outfile dist\orca-box-windows-x64.exe `
            --define 'ORCA_BOX_VERSION="test"' `
            src\main.ts

      - name: Check the built program works
        run: |
          .\dist\orca-box-windows-x64.exe orca-box --help > $null
          .\dist\orca-box-windows-x64.exe orca-box-setup --help > $null
          .\dist\orca-box-windows-x64.exe --version

      - name: Check the commands are started by name
        run: |
          # Windows has no links, so the commands are started by naming
          # the command as the first argument.
          .\dist\orca-box-windows-x64.exe orca-box-archive --help |
            Select-String -Pattern "orca-box-archive"

  # The release is made when the program and every platform's build
  # have passed: it carries the executables, so a broken one must not be
  # published.
  release:
    name: Release
    needs: [test, linux, macos, windows]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && github.ref_type == 'tag')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The tests have already run, in the job this one waits for, so
      # there is nothing to check again here: the release only builds and
      # publishes.
      - name: Build every platform
        run: ./build.sh --all

      - name: Work out the tag
        id: tag
        run: |
          version="$(cat VERSION)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # A tag that was pushed by hand: it has to be the version.
            if [ "${GITHUB_REF_NAME}" != "v$version" ]; then
              echo "VERSION is $version but the tag is ${GITHUB_REF_NAME}" >&2
              exit 1
            fi
            tag="${GITHUB_REF_NAME}"
          else
            tag="v$version"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "the release $tag is already published" >&2
            exit 0
          fi
          # The tag is made here, at the commit this run built, unless it
          # is already there.
          target=""
          if ! git rev-parse "$tag" >/dev/null 2>&1; then
            target="--target $GITHUB_SHA"
          fi
          # Another run may have published it in the meantime; that is
          # fine too.
          if ! out="$(gh release create "$tag" $target \
            --title "$tag" \
            --generate-notes \
            dist/orca-box-linux-x64 \
            dist/orca-box-linux-arm64 \
            dist/orca-box-linux-x64-musl \
            dist/orca-box-linux-arm64-musl \
            dist/orca-box-darwin-x64 \
            dist/orca-box-darwin-arm64 \
            dist/orca-box-windows-x64.exe \
            dist/SHA256SUMS 2>&1)"; then
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "the release $tag is already published" >&2
              exit 0
            fi
            echo "::error title=The release could not be published::${out//$'\n'/%0A}"
            exit 1
          fi
          echo "published $tag"
