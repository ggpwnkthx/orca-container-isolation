name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun x tsc --noEmit

      - name: Test
        run: bun test

      - name: Build
        run: ./build.sh

      - name: Check the built program works
        run: |
          ./dist/orca-box-linux-x64 orca-box --help > /dev/null
          ./dist/orca-box-linux-x64 orca-box-setup --help > /dev/null

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      # The only shell left is the installer and the build script.
      - name: Lint the shell
        run: |
          shellcheck -S warning install.sh
          shellcheck -S warning build.sh
