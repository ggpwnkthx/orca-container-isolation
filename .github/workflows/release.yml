name: Release

# Tag a version (v1.2.3) to publish a release with the single-file orca.sh
# attached. The release asset is what `orca-box-update` fetches, so a tagged
# release is what users get; the `main` branch stays the moving target.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build orca.sh
        run: ./build.sh

      - name: Check the committed orca.sh matches the sources
        run: |
          if ! git diff --quiet -- orca.sh; then
            echo "orca.sh is out of date; run ./build.sh and commit it" >&2
            git diff -- orca.sh >&2
            exit 1
          fi

      - name: Lint
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck -S warning orca.sh

      - name: Test
        run: tests/run.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME}"
          gh release create "$version" \
            --title "$version" \
            --generate-notes \
            orca.sh
