name: Release

# Tag a version (v1.2.3) to publish a release. The release carries a
# self-contained executable for each platform, plus its checksums.
#
# Users install from the latest release, so a tagged release is what they
# get; the main branch stays the moving target.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun x tsc --noEmit

      - name: Test
        run: bun test

      - name: Build every platform
        run: ./build.sh --all

      - name: Check the version matches the tag
        run: |
          version="$(cat VERSION)"
          if [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "VERSION is $version but the tag is ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/orca-box-linux-x64 \
            dist/orca-box-linux-arm64 \
            dist/SHA256SUMS \
            install.sh
